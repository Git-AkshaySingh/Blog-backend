<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Blog</title>
</head>
<body>
    <h1>My Blog</h1>
    {% if posts %}
    <ul>
        {% for post in posts %}
            <div style="border: 1px solid gray; padding: 10px; margin-bottom: 10px;">
                <h2>{{ post.title }}</h2>
                <p>{{ post.content }}</p>
            </div>
        {% endfor %}
    </ul>
    {% else %}
        <p>No post available.</p>
    {% endif%}
</body>
</html>
